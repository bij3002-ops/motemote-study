<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>미리보기 · 390 × 844</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #efeee9;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      }
      .stage {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 26px 0;
      }
      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 54px;
        background: #111114;
        padding: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.18);
      }
      .phone iframe {
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 44px;
        display: block;
        background: #fbfaf6;
      }
      .cap {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #8b8b93;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <iframe src="./index.html" title="10분 공부 플래너 미리보기"></iframe>
      </div>
      <div class="cap">10분 공부 플래너 · 390 × 844</div>
    </div>
  </body>
</html>
